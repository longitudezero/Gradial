[workspace]
members = [
    "crates/gradial-app",
    "crates/gradial-core",
    "crates/gradial-lua",
]
resolver = "3"

[workspace.package]
version = "0.3.0-beta.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["Gradial contributors"]
description = "A fast, configurable radial launcher for Windows 11"
license = "MIT"
repository = "https://github.com/longitudezero/Gradial"
homepage = "https://github.com/longitudezero/Gradial"
publish = false

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu"] }
flexi_logger = { version = "0.31", features = ["async"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4"
mlua = { version = "0.12", default-features = false, features = ["lua54", "send", "vendored"] }
raw-window-handle = "0.6"
regex = "1"
resvg = { version = "0.47", default-features = false }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemServices",
] }
zip = { version = "8.6", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
